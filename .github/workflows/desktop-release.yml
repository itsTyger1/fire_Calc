name: Desktop release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch main and tags
        shell: pwsh
        run: git fetch origin main --tags --force

      - run: npm ci

      - name: Validate release version and source commit
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$tag' must use the vX.Y.Z format."
          }

          $version = $tag.Substring(1)
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version) {
            throw "Tag $tag does not match package.json version $($package.version). Bump package.json before tagging."
          }

          $checkedOutCommit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $mainCommit = (git rev-parse origin/main).Trim()
          if ($checkedOutCommit -ne $tagCommit) {
            throw "The checkout is not at tag $tag."
          }
          if ($tagCommit -ne $mainCommit) {
            throw "Tag $tag points to $tagCommit, but origin/main is $mainCommit. Tag the current main commit."
          }

          "DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: npm test
      - run: npm run build:desktop -- --publish never
      - run: npm run test:ui

      - name: Publish installer after verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $installer = "release/FIRE-Projector-Setup-$env:DESKTOP_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not created: $installer"
          }

          $releaseExists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }

          if (-not $releaseExists) {
            gh release create $tag --verify-tag --title "FIRE Projector $env:DESKTOP_VERSION" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag $installer --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
